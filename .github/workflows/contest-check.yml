name: Contest check

# Reports which contests currently qualify for auto-registration, without signing in and
# without registering. No credential is read, so this is safe to run before the secrets
# exist and useful for confirming the division rules do what you expect.
#
# It also keeps the repository active: GitHub disables scheduled workflows in a public
# repository after 60 days without activity, and a daily commit to the status branch
# prevents that from silently stopping auto-registration.
on:
  schedule:
    - cron: '35 1 * * *'
  workflow_dispatch:

concurrency:
  group: contestpilot-contest-check
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Report qualifying contests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        # Playwright's browser binaries are not downloaded: this job never opens one.
        run: python -m pip install -r automation/requirements.txt

      - name: List qualifying contests
        env:
          CODEFORCES_HANDLE: ${{ secrets.CODEFORCES_HANDLE }}
          AUTO_REGISTER_DIVISIONS: ${{ vars.AUTO_REGISTER_DIVISIONS }}
          CONTEST_WINDOW_DAYS: ${{ vars.CONTEST_WINDOW_DAYS }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python automation/main.py --check-only --output status/contest-check.json

      - name: Show the report
        run: cat status/contest-check.json

      - name: Publish the check report
        uses: ./.github/actions/publish-status
        with:
          file: status/contest-check.json
          destination: contest-check.json
          message: 'chore: contest check report'
