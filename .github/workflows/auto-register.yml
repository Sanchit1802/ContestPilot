name: Auto-register (Codeforces)

# Registers the configured Codeforces account for qualifying contests and publishes the
# status document the Android app reads.
#
# NOT CURRENTLY SCHEDULED. Confirmed by a real run's failure diagnostics: Codeforces
# sits behind Cloudflare, and Cloudflare serves GitHub-hosted runners (well-known Azure
# datacenter IP ranges) an interactive "Verify you are human" challenge instead of the
# site. There is no way to pass that challenge without circumventing Cloudflare's bot
# protection, which this project will not do. See README.md > Limitations.
#
# workflow_dispatch is kept so this can still be run by hand - for example from a
# self-hosted runner on a home/residential IP, which Cloudflare does not challenge.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Reach the registration form without submitting anything'
        type: boolean
        default: false

concurrency:
  # Two runs signing in as the same account at once would race on registration.
  group: contestpilot-auto-register
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  register:
    name: Register and publish status
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r automation/requirements.txt

      - name: Install the Chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Run the automation
        env:
          # Secrets are passed as environment variables and never appear on a command
          # line, in a log, or in the published status file.
          CODEFORCES_HANDLE: ${{ secrets.CODEFORCES_HANDLE }}
          CODEFORCES_PASSWORD: ${{ secrets.CODEFORCES_PASSWORD }}
          AUTO_REGISTER_DIVISIONS: ${{ vars.AUTO_REGISTER_DIVISIONS }}
          CONTEST_WINDOW_DAYS: ${{ vars.CONTEST_WINDOW_DAYS }}
          AUTO_REGISTRATION_ENABLED: ${{ vars.AUTO_REGISTRATION_ENABLED }}
          # Optional override when Codeforces is slow for the runner's network.
          # Unset falls back to the 45s default in config.py.
          PLAYWRIGHT_TIMEOUT_MS: ${{ vars.PLAYWRIGHT_TIMEOUT_MS }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python automation/main.py \
            --output status/automation-status.json \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload failure diagnostics
        # A browser failure is otherwise a black box: this uploads the screenshot and
        # page HTML captured at the point of failure so it can actually be diagnosed.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: login-diagnostics
          path: status/debug
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish the status document
        uses: ./.github/actions/publish-status
        with:
          file: status/automation-status.json
          message: 'chore: auto-registration status'
